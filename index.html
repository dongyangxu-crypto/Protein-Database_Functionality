<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蛋白质功能特性数据库 · Protein Functional Properties Database</title>
<meta name="description" content="Searchable database of food protein functional properties (solubility, emulsifying, foaming, gelling, particle size, ζ-potential …) extracted from published papers, with sample composition and processing conditions.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6f5e'/%3E%3Cpath d='M9 22V10h6.5a4 4 0 0 1 0 8H9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="data-version" content="c8ef541689">
<link rel="stylesheet" href="assets/style.css?v=2df7698700">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 data-i18n="title">蛋白质功能特性数据库</h1>
    <p class="sub" id="stats"></p>
  </div>
  <div class="top-actions">
    <a class="btn ghost" id="repo-link" href="#" hidden data-i18n="source_code">GitHub</a>
    <a class="btn ghost" href="data/protein_db_csv.zip" download data-i18n="download_all">下载全部数据（CSV）</a>
    <button class="btn" id="lang-btn" type="button" aria-label="Switch language">EN</button>
  </div>
</header>

<p class="notice" id="notice" data-i18n-html="notice"></p>

<div class="layout">
  <aside class="filters" id="filters" aria-label="Filters">
    <div class="filters-head">
      <h2 data-i18n="filters">筛选</h2>
      <button class="link" id="reset" type="button" data-i18n="reset">清除全部</button>
    </div>
    <label class="field">
      <span data-i18n="keyword">关键词</span>
      <input id="q" type="search" autocomplete="off" spellcheck="false">
      <small data-i18n="keyword_hint">题目、DOI、样品、蛋白、复配物、处理、测量名称；空格分开的词都要出现</small>
    </label>
    <div id="facets"></div>
    <fieldset class="range">
      <legend data-i18n="value_range">数值范围（原单位）</legend>
      <div class="pair"><input id="vmin" type="number" step="any" inputmode="decimal" data-i18n-ph="min"><span>–</span><input id="vmax" type="number" step="any" inputmode="decimal" data-i18n-ph="max"></div>
    </fieldset>
    <fieldset class="range">
      <legend data-i18n="temp_range">处理温度（°C）</legend>
      <div class="pair"><input id="tmin" type="number" step="any" inputmode="decimal" data-i18n-ph="min"><span>–</span><input id="tmax" type="number" step="any" inputmode="decimal" data-i18n-ph="max"></div>
      <small data-i18n="temp_hint">任一处理步骤的温度落在范围内</small>
    </fieldset>
  </aside>

  <main class="results">
    <div class="toolbar">
      <button class="btn ghost only-narrow" id="toggle-filters" type="button" data-i18n="filters">筛选</button>
      <p class="count" id="count" aria-live="polite"></p>
      <div class="toolbar-right">
        <label class="sort"><span data-i18n="sort">排序</span>
          <select id="sort">
            <option value="paper" data-i18n="sort_paper">按文章</option>
            <option value="prop" data-i18n="sort_prop">按性质</option>
            <option value="vasc" data-i18n="sort_vasc">数值从小到大</option>
            <option value="vdesc" data-i18n="sort_vdesc">数值从大到小</option>
          </select>
        </label>
        <button class="btn" id="export" type="button" data-i18n="export">导出当前结果</button>
      </div>
    </div>
    <div class="table-wrap">
      <table id="tbl">
        <thead><tr>
          <th data-i18n="col_prop">性质</th>
          <th data-i18n="col_value">数值</th>
          <th data-i18n="col_sample">样品</th>
          <th data-i18n="col_protein">蛋白</th>
          <th data-i18n="col_treat">样品处理</th>
          <th data-i18n="col_cond">测试方法</th>
          <th data-i18n="col_source">来源</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="loading" data-i18n="loading">正在加载数据…</td></tr></tbody>
      </table>
    </div>
    <nav class="pager" id="pager" aria-label="Pages"></nav>
  </main>
</div>

<dialog id="detail" aria-labelledby="detail-title">
  <div class="dlg-head">
    <h2 id="detail-title"></h2>
    <button class="btn ghost" id="detail-close" type="button" data-i18n="close">关闭</button>
  </div>
  <div id="detail-body"></div>
</dialog>

<footer class="foot">
  <p data-i18n-html="footer"></p>
  <p id="built"></p>
</footer>

<script src="assets/app.js?v=4fecd7259b"></script>
</body>
</html>
